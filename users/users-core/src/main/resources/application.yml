spring:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate.format_sql: true


logging:
  level:
    github.muhsenerdev: TRACE

app:
  users:
    watchdog:
      registration-cleanup-interval: 2m
  security:
    jwt:
      secret: "default_secret_key_at_least_32_chars_long_!!"
      expiration: 3600000
    access-token:
      cookie:
        name: access_token
        http-only: true
        secure: false
        path: /