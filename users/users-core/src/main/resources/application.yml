spring:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate.format_sql: true


logging:
  level: 
    github.muhsenerdev: TRACE

app:
  users:
    watchdog:
      registration-cleanup-interval: 10s